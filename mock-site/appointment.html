<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment - Demo Seva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <div>Government of DemoState | Ministry of Electronic Services</div>
        <div class="top-bar-right">
            <span onclick="skipToMain()" onkeypress="if(event.key==='Enter') skipToMain()" tabindex="0" style="cursor: pointer;">Skip to Main Content</span>
            <span>A- | A | A+</span>
        </div>
    </div>

    <header class="header-main">
        <div class="logo-area" onclick="goTo('index')">
            <img src="https://dummyimage.com/60x60/ffffff/0f4a8a.png&text=DS" alt="Home" style="border-radius: 8px; border: 1px solid #e2e8f0;">
            <div class="logo-text"><h2>Demo Seva Portal</h2></div>
        </div>
    </header>

    <div class="container" id="main-content" tabindex="-1" style="max-width: 700px;">
        <h2 class="fixed-only">Schedule Office Visit</h2>
        <div class="fake-heading trap-only">Schedule Office Visit</div>
        
        <div style="background: var(--bg-light); padding: 25px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px;">
            
            <!-- TRAP: Custom Div-Based Calendar -->
            <div class="form-group trap-only" style="margin-bottom: 20px;">
                <span style="font-weight: 600; display: block; margin-bottom: 8px; color: var(--gov-blue);">1. Select Date</span>
                
                <!-- Fake Input Display -->
                <div id="fake-date-display" style="border: 1px solid var(--border); padding: 14px 16px; border-radius: 8px; background: white; cursor: pointer; color: var(--text-muted);" onclick="document.getElementById('fake-calendar').style.display='block'">
                    Click to choose a date...
                </div>
                
                <!-- Fake Calendar Dropdown -->
                <div id="fake-calendar" style="display: none; margin-top: 10px; background: white; padding: 15px; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-md); max-height: 220px; overflow-y: auto;">
                    <div id="fake-calendar-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
                        <!-- JavaScript will automatically populate the next 30 days here as inaccessible div tags -->
                    </div>
                </div>
            </div>

            <!-- FIXED: Accessible Native Date Input -->
            <div class="form-group fixed-only" style="margin-bottom: 20px;">
                <label for="appointment-date" style="font-weight: 600; display: block; margin-bottom: 8px; color: var(--gov-blue);">1. Select Date</label>
                <input type="date" id="appointment-date" style="width: 100%; max-width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 8px; background: white;">
            </div>

            <!-- TIME SLOTS -->
            <div style="border-top: 1px solid var(--border); padding-top: 20px;">
                <span class="trap-only" style="font-weight: 600; color: var(--gov-blue); margin-bottom: 15px; display: block;">2. Select Time</span>
                <label class="fixed-only" style="font-weight: 600; color: var(--gov-blue); margin-bottom: 15px; display: block;">2. Select Time</label>
                
                <div class="slots-grid">
                    <div class="time-slot trap-only" onclick="selectSlot(this)">10:00 AM</div>
                    <div class="time-slot trap-only" onclick="selectSlot(this)">11:30 AM</div>
                    <div class="time-slot trap-only" onclick="selectSlot(this)">02:00 PM</div>
                    
                    <button class="time-slot fixed-only" onclick="selectSlot(this)">10:00 AM</button>
                    <button class="time-slot fixed-only" onclick="selectSlot(this)">11:30 AM</button>
                    <button class="time-slot fixed-only" onclick="selectSlot(this)">02:00 PM</button>
                </div>
            </div>
        </div>
        
        <div style="text-align: right;">
            <button class="nav-btn" onclick="alert('Appointment Confirmed!'); goTo('index');">Confirm Booking</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
